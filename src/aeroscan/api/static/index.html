<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>aeroscan - bcn</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
body { font-family: monospace; margin: 8px; }
#map { height: 450px; border: 1px solid black; }
table { border-collapse: collapse; }
td, th { border: 1px solid gray; padding: 2px 6px; text-align: left; }
.HIGH { color: red; }
.MEDIUM { color: #c60; }
</style>
</head>
<body>
<h2>aeroscan - barcelona</h2>
<pre id="status">loading...</pre>
<div id="map"></div>
<h3>alerts (last 30)</h3>
<table>
<thead><tr><th>time</th><th>aircraft</th><th>rule</th><th>sev</th><th>summary</th><th>p_real</th></tr></thead>
<tbody id="alerts"></tbody>
</table>
<p><a href="/docs">api docs</a> | data from <a href="https://opensky-network.org">opensky network</a></p>
<script>
var map = L.map("map").setView([41.3, 2.5], 7);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
L.rectangle([[39.3, 0.0], [43.3, 5.0]], { color: "black", weight: 1, fill: false }).addTo(map);
var planes = L.layerGroup().addTo(map);
var markers = {};

function cell(tr, value, cls) {
  var td = document.createElement("td");
  td.textContent = value;  // never innerHTML: callsigns and summaries come from outside
  if (cls) td.className = cls;
  tr.appendChild(td);
}

function n(v) { return v == null ? "-" : Math.round(v); }

function update() {
  Promise.all([
    fetch("/api/v1/stats").then(function (r) { return r.json(); }),
    fetch("/api/v1/aircraft").then(function (r) { return r.json(); }),
    fetch("/api/v1/alerts?limit=30").then(function (r) { return r.json(); })
  ]).then(function (res) {
    var s = res[0], aircraft = res[1], alerts = res[2];
    document.getElementById("status").textContent =
      "last poll: " + (s.last_poll_at || "never") + "   aircraft: " + s.aircraft_now +
      "   alerts 24h: " + s.alerts_last_24h + "   filtered: " + s.suppressed_total +
      "   mode: " + s.mode + "   credits: " + (s.credits_remaining == null ? "?" : s.credits_remaining);

    planes.clearLayers();
    markers = {};
    aircraft.forEach(function (a) {
      var m = L.circleMarker([a.latitude, a.longitude], {
        radius: a.alerted ? 7 : 4, color: a.alerted ? "red" : "blue", weight: 1, fillOpacity: 0.8
      }).addTo(planes);
      var p = document.createElement("pre");  // text, not HTML
      p.textContent = (a.callsign || a.icao24) + "\n" + n(a.altitude_ft) + " ft, " + n(a.groundspeed_kt) +
        " kt, " + n(a.vertical_rate_fpm) + " ft/min, sq " + (a.squawk || "-");
      m.bindPopup(p);
      markers[a.icao24] = m;
    });

    var tbody = document.getElementById("alerts");
    tbody.innerHTML = "";
    if (alerts.length === 0) {
      var tr = document.createElement("tr");
      cell(tr, "no alerts");
      tbody.appendChild(tr);
    }
    alerts.forEach(function (a) {
      var tr = document.createElement("tr");
      cell(tr, a.detected_at.replace("T", " ").slice(0, 19));
      cell(tr, a.callsign || a.icao24);
      cell(tr, a.rule);
      cell(tr, a.severity, a.severity);
      cell(tr, a.summary);
      cell(tr, a.p_real == null ? "" : a.p_real.toFixed(2));
      tr.onclick = function () { if (markers[a.icao24]) markers[a.icao24].openPopup(); };
      tbody.appendChild(tr);
    });
  }).catch(function (e) {
    document.getElementById("status").textContent = "error: " + e;
  });
}

update();
setInterval(update, 15000);
</script>
</body>
</html>
