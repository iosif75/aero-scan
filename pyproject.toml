[project]
name = "aeroscan"
version = "0.1.0"
description = "Flight anomaly detection on open ADS-B data: deterministic rules flag, a gradient-boosted triage model filters."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iosif Baisan" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
eval = ["pandas>=2.2", "pyarrow>=16"]
triage = ["pandas>=2.2", "pyarrow>=16", "scikit-learn>=1.5"]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "scikit-learn>=1.5",  # to load the triage model, if one has been built
]
django = [
    "django>=5.2",  # admin and alert review, mounted at /admin by `aeroscan serve`
]

[project.scripts]
aeroscan = "aeroscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.2",
    "pyarrow>=16",
    "pandas-stubs",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeroscan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/aeroscan/console/migrations/*" = ["RUF012"]  # Django's migration class attributes

[tool.mypy]
strict = true
packages = ["aeroscan"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*", "django.*"]
ignore_missing_imports = true

# Django ships no type hints: its models and admin classes are Any to mypy.
[[tool.mypy.overrides]]
module = ["aeroscan.console.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aeroscan.console.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette 1.x wants the httpx2 package for its TestClient; plain httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
