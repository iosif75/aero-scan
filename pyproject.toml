[project]
name = "aeroscan"
version = "0.1.0"
description = "Flight anomaly detection on open ADS-B data: deterministic rules decide, a local LLM explains."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iosif Baisan" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
eval = ["pandas>=2.2", "pyarrow>=16"]

[project.scripts]
aeroscan = "aeroscan.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2.2", "pyarrow>=16", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeroscan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["aeroscan"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
