[project]
name = "aeroscan"
version = "0.1.0"
description = "Flight anomaly detection on open ADS-B data: deterministic rules decide, a local LLM explains."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iosif Baisan" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
eval = ["pandas>=2.2", "pyarrow>=16"]
triage = ["pandas>=2.2", "pyarrow>=16", "scikit-learn>=1.5"]
train = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "torch>=2.6",
    "transformers>=4.46",
    "peft>=0.13",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "scikit-learn>=1.5",  # to load the triage model, if one has been built
]

[project.scripts]
aeroscan = "aeroscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.2",
    "pyarrow>=16",
    "pandas-stubs",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeroscan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["aeroscan"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*", "peft.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch: CUDA 12.8 build on Windows (consumer NVIDIA GPUs), CPU build on Linux/macOS.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
